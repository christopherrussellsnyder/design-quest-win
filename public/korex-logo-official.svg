<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <!-- Background -->
  <rect width="400" height="400" fill="#060606"/>

  <!-- KOREX OFFICIAL MARK — Splintered K -->
  <!-- Vertical spine -->
  <rect x="72" y="32" width="48" height="336" fill="#CC0000"/>

  <!-- Upper arm — primary shard -->
  <polygon points="120,32 120,120 344,32 280,32" fill="#EEEEEE"/>

  <!-- Upper arm — secondary shard (offset, dimmer) -->
  <polygon points="120,88 120,168 344,32 272,32" fill="#CC0000" opacity="0.7"/>

  <!-- Lower arm — secondary shard -->
  <polygon points="120,232 120,312 344,368 272,368" fill="#CC0000" opacity="0.7"/>

  <!-- Lower arm — primary shard -->
  <polygon points="120,280 120,368 240,368 200,368" fill="#EEEEEE"/>

  <!-- Shard split lines -->
  <line x1="120" y1="88" x2="240" y2="32" stroke="#060606" strokeWidth="8"/>
  <line x1="120" y1="312" x2="240" y2="368" stroke="#060606" strokeWidth="8"/>
</svg>
