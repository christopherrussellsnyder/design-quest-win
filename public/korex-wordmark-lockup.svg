<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 200" width="700" height="200">
  <!-- Transparent background -->

  <!-- SPLINTERED K MARK — scaled down -->
  <rect x="30" y="20" width="22" height="160" fill="#CC0000"/>
  <polygon points="52,20 52,58 158,20 126,20" fill="#EEEEEE"/>
  <polygon points="52,42 52,80 158,20 124,20" fill="#CC0000" opacity="0.7"/>
  <polygon points="52,110 52,148 158,180 128,180" fill="#CC0000" opacity="0.7"/>
  <polygon points="52,134 52,180 114,180 96,180" fill="#EEEEEE"/>
  <line x1="52" y1="42" x2="114" y2="20" stroke="#060606" strokeWidth="4"/>
  <line x1="52" y1="148" x2="114" y2="180" stroke="#060606" strokeWidth="4"/>

  <!-- Divider line -->
  <rect x="188" y="30" width="2" height="140" fill="#CC0000" opacity="0.4"/>

  <!-- KOREX wordmark -->
  <text
    x="212"
    y="130"
    font-family="Arial Black, Arial Bold, sans-serif"
    font-weight="900"
    font-size="88"
    letter-spacing="16"
    fill="#EEEEEE"
  >KOREX</text>

  <!-- Tagline -->
  <text
    x="214"
    y="162"
    font-family="Arial, sans-serif"
    font-size="16"
    letter-spacing="8"
    fill="#CC0000"
  >INTELLIGENCE SYSTEMS</text>

  <!-- Bottom red underline -->
  <rect x="212" y="168" width="458" height="2" fill="#CC0000" opacity="0.5"/>
</svg>
