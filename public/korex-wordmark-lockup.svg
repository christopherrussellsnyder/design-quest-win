    <polygon points="0,0 12,0 28,22 12,22" fill="#CC0000"/>
    <polygon points="0,56 12,56 12,34 0,22" fill="#CC0000"/>
    <polygon points="14,23 28,0 40,0 22,28" fill="#CC0000" opacity="0.9"/>
    <polygon points="14,33 22,28 40,56 28,56" fill="#CC0000" opacity="0.85"/>
